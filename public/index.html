<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastebin-Lite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .help-text {
            font-size: 0.85em;
            color: #888;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 6px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .result h3 {
            margin-bottom: 10px;
            color: #155724;
        }

        .result.error h3 {
            color: #721c24;
        }

        .result-url {
            word-break: break-all;
            background: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
        }

        .result-url a {
            color: #667eea;
            text-decoration: none;
        }

        .result-url a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 600px) {
            .options {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Pastebin-Lite</h1>
        <p class="subtitle">Create and share text pastes instantly</p>

        <form id="pasteForm">
            <div class="form-group">
                <label for="content">Paste Content *</label>
                <textarea id="content" name="content" required placeholder="Enter your text here..."></textarea>
            </div>

            <div class="options">
                <div class="form-group">
                    <label for="ttl_seconds">TTL (seconds)</label>
                    <input type="number" id="ttl_seconds" name="ttl_seconds" min="1" placeholder="Optional">
                    <div class="help-text">Paste expires after this time</div>
                </div>

                <div class="form-group">
                    <label for="max_views">Max Views</label>
                    <input type="number" id="max_views" name="max_views" min="1" placeholder="Optional">
                    <div class="help-text">Maximum number of views</div>
                </div>
            </div>

            <button type="submit" id="submitBtn">Create Paste</button>
        </form>

        <div id="result" class="result">
            <h3 id="resultTitle"></h3>
            <div id="resultMessage"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('pasteForm');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const content = formData.get('content').trim();
            const ttl_seconds = formData.get('ttl_seconds');
            const max_views = formData.get('max_views');

            if (!content) {
                showError('Content is required');
                return;
            }

            const payload = {
                content: content
            };

            if (ttl_seconds) {
                const ttl = parseInt(ttl_seconds);
                if (ttl >= 1) {
                    payload.ttl_seconds = ttl;
                }
            }

            if (max_views) {
                const views = parseInt(max_views);
                if (views >= 1) {
                    payload.max_views = views;
                }
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            try {
                const response = await fetch('/api/pastes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess(data);
                } else {
                    showError(data.error?.message || 'Failed to create paste');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Paste';
            }
        });

        function showSuccess(data) {
            result.className = 'result success show';
            resultTitle.textContent = '✅ Paste Created Successfully!';
            
            const urlDiv = document.createElement('div');
            urlDiv.className = 'result-url';
            urlDiv.innerHTML = `
                <strong>Share this URL:</strong><br>
                <a href="${data.url}" target="_blank">${data.url}</a>
                <button type="button" class="copy-btn">Copy URL</button>
            `;
            const copyBtn = urlDiv.querySelector('.copy-btn');
            copyBtn.addEventListener('click', function () {
                copyToClipboard(data.url, this);
            });
            
            resultMessage.innerHTML = '';
            resultMessage.appendChild(urlDiv);
            
            // Scroll to result
            result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showError(message) {
            result.className = 'result error show';
            resultTitle.textContent = '❌ Error';
            resultMessage.textContent = message;
            
            // Scroll to result
            result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyToClipboard(text, buttonEl) {
            navigator.clipboard.writeText(text).then(() => {
                if (buttonEl) {
                    const originalText = buttonEl.textContent;
                    buttonEl.textContent = 'Copied!';
                    setTimeout(() => {
                        buttonEl.textContent = originalText;
                    }, 2000);
                }
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }
    </script>
</body>
</html>
